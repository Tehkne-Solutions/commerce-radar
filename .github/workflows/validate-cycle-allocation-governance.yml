name: Validar governança da alocação

on:
  pull_request:
    paths:
      - 'activation-experiment-allocation.js'
      - 'activation-experiment-allocation.css'
      - 'activation-playbook-version-experiments.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/CYCLE_ALLOCATION_GOVERNANCE.md'
      - 'tests/validate-cycle-allocation-governance.js'
      - '.github/workflows/validate-cycle-allocation-governance.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-cycle-allocation-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Validar sintaxe
        run: |
          node --check activation-experiment-allocation.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-cycle-allocation-governance.js
      - name: Testar balanceamento, exceções e parada
        run: node tests/validate-cycle-allocation-governance.js
