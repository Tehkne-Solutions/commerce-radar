name: Validar acompanhamento diário

on:
  pull_request:
    paths:
      - 'activation-tracking.js'
      - 'activation-tracking.css'
      - 'activation-plan.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/DAILY_ACTIVATION_TRACKING.md'
      - 'tests/validate-activation-tracking.js'
      - '.github/workflows/validate-activation-tracking.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-activation-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check activation-plan.js
          node --check activation-tracking.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-activation-tracking.js

      - name: Testar acompanhamento diário
        run: node tests/validate-activation-tracking.js
