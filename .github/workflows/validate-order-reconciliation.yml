name: Validar reconciliação por pedido

on:
  pull_request:
    paths:
      - 'financial-reconciliation.js'
      - 'financial-reconciliation.css'
      - 'data.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/ORDER_RECONCILIATION.md'
      - '.github/workflows/validate-order-reconciliation.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-order-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check financial-reconciliation.js
          node --check data.js
          node --check sw.js

      - name: Testar consolidação e rateio
        run: |
          node <<'NODE'
          global.window = undefined;
          global.document = undefined;
          require('./financial-reconciliation.js');
          const api = global.CommerceRadarReconciliation;
          if (!api) throw new Error('API de reconciliação não inicializada');
          if (api.smartSum([10,10]) !== 10) throw new Error('Valor repetido deveria ser contado uma vez');
          if (api.smartSum([5,7]) !== 12) throw new Error('Valores diferentes deveriam ser somados');
          if (api.parseNumber('R$ 1.234,56') !== 1234.56) throw new Error('Moeda pt-BR inválida');
          const shopify=`Name,Financial Status,Lineitem quantity,Lineitem name,Lineitem price,Lineitem sku,Shipping,Discount Amount,Taxes,Net Payout,Cost\n#1001,paid,1,Produto A,60,A,10,5,3,82,20\n,paid,1,Produto B,40,B,10,5,3,82,10`;
          const result=api.analyzeText(shopify,'orders-shopify.csv');
          if(!result.matched||result.preset.id!=='shopify'||result.orders.length!==1)throw new Error('Shopify não consolidado');
          const order=result.orders[0];
          if(order.grossRevenue!==100||order.shippingCost!==10||order.discounts!==5||order.taxes!==3)throw new Error('Totais Shopify duplicados');
          if(order.expectedPayout!==82||order.payoutVariance!==0)throw new Error('Repasse Shopify incorreto');
          const productA=result.products.find(item=>item.sku==='A');
          const productB=result.products.find(item=>item.sku==='B');
          if(!productA||!productB)throw new Error('Produtos Shopify ausentes');
          if(Math.abs(productA.shippingCost-6)>.001||Math.abs(productB.shippingCost-4)>.001)throw new Error('Rateio de frete falhou');
          const shopee=`No. do pedido;Status do pedido;Nome do produto;Número de referência SKU;Quantidade;Preço acordado;Subtotal do produto;Taxa de comissão;Taxa de transação;Taxa de envio;Seller income\nS-10;Concluído;Produto A;A;1;50,00;50,00;5,00;1,00;8,00;80,00\nS-10;Concluído;Produto B;B;1;50,00;50,00;5,00;1,00;8,00;80,00`;
          const shopeeOrder=api.analyzeText(shopee,'pedidos-shopee.csv').orders[0];
          if(shopeeOrder.marketplaceFees!==10||shopeeOrder.paymentFees!==2||shopeeOrder.shippingCost!==8||shopeeOrder.expectedPayout!==80)throw new Error('Shopee inválida');
          const canceled=api.analyzeText(`Order ID,Order Status,Product,Quantity,Unit Price\n1,cancelled,Produto,1,100`,'orders.csv','generic');
          if(canceled.orders.length!==0)throw new Error('Pedido cancelado não ignorado');
          console.log('Deduplicação, taxas por item, rateio e repasses válidos.');
          NODE

      - name: Validar integração, backup, nuvem e PWA
        run: |
          node <<'NODE'
          const fs=require('fs');
          const code=fs.readFileSync('financial-reconciliation.js','utf8');
          const css=fs.readFileSync('financial-reconciliation.css','utf8');
          const data=fs.readFileSync('data.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const version=fs.readFileSync('VERSION','utf8').trim();
          const docs=fs.readFileSync('docs/ORDER_RECONCILIATION.md','utf8');
          for(const marker of ['Reconciliação por pedido','Repasse esperado','reconciliationBatches',"version:'0.4.3'",'Tehkné Solutions'])if(!code.includes(marker))throw new Error(`Marcador ausente: ${marker}`);
          for(const asset of ['./financial-reconciliation.css','./financial-reconciliation.js']){if(!data.includes(asset))throw new Error(`Loader ausente: ${asset}`);if(!sw.includes(asset))throw new Error(`Cache offline ausente: ${asset}`)}
          if(data.indexOf('./financial-reconciliation.js')<data.indexOf('./financial-audit.js'))throw new Error('Reconciliação deve carregar após auditoria');
          if(!css.includes('.reconciliationGrid')||!css.includes('.reconciliationBatch'))throw new Error('Estilos ausentes');
          const parts=version.split('.').map(Number);if(parts[0]!==0||parts[1]<4||(parts[1]===4&&parts[2]<3))throw new Error(`Versão anterior à 0.4.3: ${version}`);
          for(const marker of ['Valores repetidos no pedido','Rateio entre produtos','Diferença de repasse'])if(!docs.includes(marker))throw new Error(`Documentação incompleta: ${marker}`);
          console.log('Integração, backup, nuvem, documentação e PWA válidos.');
          NODE
