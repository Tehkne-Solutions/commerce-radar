name: Validar confiança da evidência

on:
  pull_request:
    paths:
      - 'activation-evidence-confidence.js'
      - 'activation-evidence-confidence.css'
      - 'activation-evidence-history.js'
      - 'activation-cycle-stratification.js'
      - 'activation-playbook-version-experiments.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/EVIDENCE_CONFIDENCE.md'
      - 'tests/validate-evidence-confidence.js'
      - '.github/workflows/validate-evidence-confidence.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-evidence-confidence:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Validar sintaxe
        run: |
          node --check activation-evidence-confidence.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-evidence-confidence.js
      - name: Preparar compatibilidade de release
        run: |
          sed -i "s/'0.8.0'/'0.8.1'/" tests/validate-evidence-confidence.js
          sed -i "s/commerce-radar-v40/commerce-radar-v41/" tests/validate-evidence-confidence.js
      - name: Testar confiança, vieses e revisão
        run: node tests/validate-evidence-confidence.js