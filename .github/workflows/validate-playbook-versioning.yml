name: Validar versionamento dos playbooks

on:
  pull_request:
    paths:
      - 'activation-playbook-versions.js'
      - 'activation-playbook-versions.css'
      - 'activation-playbook-performance.js'
      - 'activation-playbooks.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/PLAYBOOK_VERSIONING.md'
      - 'tests/validate-playbook-versions.js'
      - '.github/workflows/validate-playbook-versioning.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-playbook-versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check activation-playbook-versions.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-playbook-versions.js

      - name: Testar versões, variantes e rollback
        run: node tests/validate-playbook-versions.js
