name: Validar Commerce Radar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check v021.js
          node --check cloud-config.js
          node --check cloud.js
          node --check cloud-bootstrap.js
          node --check cloud-diagnostics.js
          node --check cloud-history.js
          node --check sw.js

      - name: Validar catálogo
        run: |
          node <<'NODE'
          global.window = {};
          global.document = undefined;
          require('./data.js');
          const data = window.COMMERCE_RADAR_DATA;
          if (!data) throw new Error('Catálogo não inicializado');
          if (data.opportunities.length !== 20) throw new Error(`Esperadas 20 oportunidades; recebidas ${data.opportunities.length}`);
          const ids = data.opportunities.map(item => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Há IDs duplicados no catálogo');
          console.log(`Catálogo válido: ${ids.length} oportunidades.`);
          NODE

      - name: Validar módulos, segurança e migrations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const operational = fs.readFileSync('v021.js', 'utf8');
          const cloud = fs.readFileSync('cloud.js', 'utf8');
          const bootstrap = fs.readFileSync('cloud-bootstrap.js', 'utf8');
          const diagnostics = fs.readFileSync('cloud-diagnostics.js', 'utf8');
          const history = fs.readFileSync('cloud-history.js', 'utf8');
          const data = fs.readFileSync('data.js', 'utf8');
          const config = fs.readFileSync('cloud-config.js', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const baseMigration = fs.readFileSync('supabase/migrations/20260726160000_create_commerce_radar_workspaces.sql', 'utf8');
          const historyMigration = fs.readFileSync('supabase/migrations/20260726190000_add_workspace_history_and_conflicts.sql', 'utf8');
          const provision = fs.readFileSync('.github/workflows/provision-supabase.yml', 'utf8');

          for (const marker of ['customOpportunities', 'launchPlans', 'Restaurar backup', 'Planos de lançamento', 'Tehkné Solutions']) {
            if (!operational.includes(marker)) throw new Error(`Marcador operacional ausente: ${marker}`);
          }

          for (const marker of [
            '/auth/v1/signup', 'grant_type=password', 'grant_type=refresh_token',
            '/rest/v1/rpc/sync_commerce_radar_workspace', 'commerce-radar-cloud-revision',
            'commerce-radar-cloud-conflict', "version:'0.3.3'", 'Tehkné Solutions'
          ]) {
            if (!cloud.includes(marker)) throw new Error(`Marcador de nuvem ausente: ${marker}`);
          }

          for (const marker of ['cloudBootstrap', 'cloudSignUp', 'cloudPush', 'bootstrap-pending', 'workspace enviado']) {
            if (!bootstrap.includes(marker)) throw new Error(`Marcador de ativação guiada ausente: ${marker}`);
          }

          for (const marker of ['DIAGNÓSTICO ADMINISTRATIVO', 'Data API e RLS anônimo', 'Sessão autenticada', 'PWA e modo offline']) {
            if (!diagnostics.includes(marker)) throw new Error(`Marcador de diagnóstico ausente: ${marker}`);
          }

          for (const marker of [
            'Histórico e conflitos', 'commerce_radar_workspace_versions', 'conflict_merge',
            'conflict_keep_local', 'restore_r', 'Usar versão da nuvem', 'Tehkné Solutions'
          ]) {
            if (!history.includes(marker)) throw new Error(`Marcador de histórico ausente: ${marker}`);
          }

          for (const asset of [
            './cloud.css', './cloud-diagnostics.css', './cloud-history.css',
            './cloud-config.js', './cloud.js', './cloud-bootstrap.js',
            './cloud-diagnostics.js', './cloud-history.js'
          ]) {
            if (!data.includes(asset)) throw new Error(`Loader ausente em data.js: ${asset}`);
            if (!sw.includes(asset)) throw new Error(`Asset ausente no cache offline: ${asset}`);
          }

          if (!config.includes('commerce_radar_workspaces')) throw new Error('Tabela principal não configurada');
          if (!config.includes('commerce_radar_workspace_versions')) throw new Error('Tabela de versões não configurada');

          if (!baseMigration.includes('enable row level security')) throw new Error('RLS base ausente');
          for (const marker of [
            'commerce_radar_workspace_versions', 'sync_commerce_radar_workspace',
            'expected_revision', "status text", 'security definer',
            'revoke insert, update, delete on table public.commerce_radar_workspaces from authenticated',
            '(select auth.uid()) = user_id', 'Workspace payload exceeds 5 MB'
          ]) {
            if (!historyMigration.includes(marker)) throw new Error(`Proteção de histórico ausente: ${marker}`);
          }

          for (const marker of [
            'workflow_dispatch', 'SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD',
            'supabase db push', 'cloud-config.js', 'github-actions[bot]'
          ]) {
            if (!provision.includes(marker)) throw new Error(`Marcador de provisionamento ausente: ${marker}`);
          }

          for (const [name, source] of Object.entries({cloud, bootstrap, diagnostics, history, config})) {
            if (source.includes('service_role')) throw new Error(`O frontend ${name} não pode conter service role`);
          }

          console.log('Módulos, histórico, conflito, migrations, RLS e provisionamento válidos.');
          NODE

      - name: Validar HTML, manifesto e referências
        run: |
          python <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet':
                      self.styles.append(attrs.get('href'))

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          parser = IdParser()
          parser.feed(html)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'IDs HTML duplicados: {duplicates}')

          referenced = set(re.findall(r"\$('([^']+)'\)", app))
          missing = sorted(referenced - set(parser.ids))
          if missing:
              raise SystemExit(f'IDs estáticos referenciados e ausentes: {missing}')

          if parser.scripts != ['./data.js', './app.js', './v021.js']:
              raise SystemExit(f'Scripts inesperados ou fora de ordem: {parser.scripts}')
          if parser.styles != ['./styles.css', './v021.css']:
              raise SystemExit(f'Folhas de estilo inesperadas: {parser.styles}')

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for field in ('name', 'short_name', 'start_url', 'display'):
              if not manifest.get(field):
                  raise SystemExit(f'Campo ausente no manifesto: {field}')

          print(f'HTML válido: {len(parser.ids)} IDs estáticos e manifesto verificados.')
          PY
