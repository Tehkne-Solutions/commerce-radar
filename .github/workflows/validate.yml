name: Validar Commerce Radar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check v021.js
          node --check sw.js

      - name: Validar catálogo
        run: |
          node <<'NODE'
          global.window = {};
          require('./data.js');
          const data = window.COMMERCE_RADAR_DATA;
          if (!data) throw new Error('Catálogo não inicializado');
          if (data.opportunities.length !== 20) throw new Error(`Esperadas 20 oportunidades; recebidas ${data.opportunities.length}`);
          const ids = data.opportunities.map(item => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Há IDs duplicados no catálogo');
          console.log(`Catálogo válido: ${ids.length} oportunidades.`);
          NODE

      - name: Validar módulo operacional
        run: |
          node <<'NODE'
          const fs = require('fs');
          const code = fs.readFileSync('v021.js', 'utf8');
          const required = [
            'customOpportunities',
            'launchPlans',
            'Restaurar backup',
            'Planos de lançamento',
            "version:'0.2.1'",
            'Tehkné Solutions'
          ];
          for (const marker of required) {
            if (!code.includes(marker)) throw new Error(`Marcador ausente no módulo v0.2.1: ${marker}`);
          }
          console.log('Módulo v0.2.1 contém cadastro, restauração, planos e assinatura.');
          NODE

      - name: Validar HTML, manifesto e referências
        run: |
          python <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet':
                      self.styles.append(attrs.get('href'))

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          ext = Path('v021.js').read_text(encoding='utf-8')
          parser = IdParser()
          parser.feed(html)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'IDs HTML duplicados: {duplicates}')

          referenced = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(referenced - set(parser.ids))
          if missing:
              raise SystemExit(f'IDs estáticos referenciados e ausentes: {missing}')

          expected_scripts = ['./data.js', './app.js', './v021.js']
          if parser.scripts != expected_scripts:
              raise SystemExit(f'Scripts inesperados ou fora de ordem: {parser.scripts}')
          if parser.styles != ['./styles.css', './v021.css']:
              raise SystemExit(f'Folhas de estilo inesperadas: {parser.styles}')

          for marker in ('customModal', 'restoreModal', 'launchModal', 'launchGrid'):
              if marker not in ext:
                  raise SystemExit(f'Interface dinâmica ausente: {marker}')

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for field in ('name', 'short_name', 'start_url', 'display'):
              if not manifest.get(field):
                  raise SystemExit(f'Campo ausente no manifesto: {field}')

          print(f'HTML válido: {len(parser.ids)} IDs estáticos, scripts e estilos verificados.')
          PY
