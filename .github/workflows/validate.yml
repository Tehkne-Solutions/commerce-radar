name: Validar Commerce Radar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check v021.js
          node --check cloud-config.js
          node --check cloud.js
          node --check cloud-bootstrap.js
          node --check sw.js

      - name: Validar catálogo
        run: |
          node <<'NODE'
          global.window = {};
          global.document = undefined;
          require('./data.js');
          const data = window.COMMERCE_RADAR_DATA;
          if (!data) throw new Error('Catálogo não inicializado');
          if (data.opportunities.length !== 20) throw new Error(`Esperadas 20 oportunidades; recebidas ${data.opportunities.length}`);
          const ids = data.opportunities.map(item => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Há IDs duplicados no catálogo');
          console.log(`Catálogo válido: ${ids.length} oportunidades.`);
          NODE

      - name: Validar módulo operacional
        run: |
          node <<'NODE'
          const fs = require('fs');
          const code = fs.readFileSync('v021.js', 'utf8');
          const required = [
            'customOpportunities',
            'launchPlans',
            'Restaurar backup',
            'Planos de lançamento',
            "version:'0.2.1'",
            'Tehkné Solutions'
          ];
          for (const marker of required) {
            if (!code.includes(marker)) throw new Error(`Marcador ausente no módulo v0.2.1: ${marker}`);
          }
          console.log('Módulo v0.2.1 contém cadastro, restauração, planos e assinatura.');
          NODE

      - name: Validar conta, ativação e provisionamento
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cloud = fs.readFileSync('cloud.js', 'utf8');
          const bootstrap = fs.readFileSync('cloud-bootstrap.js', 'utf8');
          const data = fs.readFileSync('data.js', 'utf8');
          const config = fs.readFileSync('cloud-config.js', 'utf8');
          const sql = fs.readFileSync('docs/supabase.sql', 'utf8');
          const migration = fs.readFileSync('supabase/migrations/20260726160000_create_commerce_radar_workspaces.sql', 'utf8');
          const provision = fs.readFileSync('.github/workflows/provision-supabase.yml', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');

          const cloudMarkers = [
            '/auth/v1/signup',
            'grant_type=password',
            'grant_type=refresh_token',
            'resolution=merge-duplicates',
            'Mesclar dispositivo e nuvem',
            "version:'0.3.0'",
            'tehkne-commerce-radar-cloud-session',
            'Tehkné Solutions'
          ];
          for (const marker of cloudMarkers) {
            if (!cloud.includes(marker)) throw new Error(`Marcador ausente no módulo v0.3: ${marker}`);
          }

          for (const marker of ['cloudBootstrap', 'cloudSignUp', 'cloudPush', 'bootstrap-pending', 'workspace enviado']) {
            if (!bootstrap.includes(marker)) throw new Error(`Marcador ausente na ativação guiada: ${marker}`);
          }

          for (const asset of ['./cloud.css', './cloud-config.js', './cloud.js', './cloud-bootstrap.js']) {
            if (!data.includes(asset)) throw new Error(`Loader ausente em data.js: ${asset}`);
            if (!sw.includes(asset)) throw new Error(`Asset ausente no cache offline: ${asset}`);
          }

          if (!config.includes('commerce_radar_workspaces')) throw new Error('Tabela padrão não configurada');
          for (const source of [sql, migration]) {
            if (!source.includes('enable row level security')) throw new Error('RLS não habilitada na migration');
            if (!source.includes('(select auth.uid()) = user_id')) throw new Error('Política por usuário ausente');
          }

          const provisionMarkers = [
            'workflow_dispatch',
            'SUPABASE_ACCESS_TOKEN',
            'SUPABASE_DB_PASSWORD',
            'api.supabase.com/v1/projects',
            'supabase db push',
            'cloud-config.js',
            'commerce_radar_workspaces',
            'github-actions[bot]'
          ];
          for (const marker of provisionMarkers) {
            if (!provision.includes(marker)) throw new Error(`Marcador ausente no provisionamento: ${marker}`);
          }

          if (cloud.includes('service_role') || bootstrap.includes('service_role') || config.includes('service_role')) {
            throw new Error('O frontend não pode conter service role');
          }
          console.log('Conta, ativação guiada, cache, migration, RLS e provisionamento válidos.');
          NODE

      - name: Validar HTML, manifesto e referências
        run: |
          python <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet':
                      self.styles.append(attrs.get('href'))

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          ext = Path('v021.js').read_text(encoding='utf-8')
          cloud = Path('cloud.js').read_text(encoding='utf-8')
          bootstrap = Path('cloud-bootstrap.js').read_text(encoding='utf-8')
          parser = IdParser()
          parser.feed(html)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'IDs HTML duplicados: {duplicates}')

          referenced = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(referenced - set(parser.ids))
          if missing:
              raise SystemExit(f'IDs estáticos referenciados e ausentes: {missing}')

          expected_scripts = ['./data.js', './app.js', './v021.js']
          if parser.scripts != expected_scripts:
              raise SystemExit(f'Scripts inesperados ou fora de ordem: {parser.scripts}')
          if parser.styles != ['./styles.css', './v021.css']:
              raise SystemExit(f'Folhas de estilo inesperadas: {parser.styles}')

          for marker in ('customModal', 'restoreModal', 'launchModal', 'launchGrid'):
              if marker not in ext:
                  raise SystemExit(f'Interface dinâmica ausente: {marker}')

          for marker in ('cloudNav', 'cloudState', 'cloudPush', 'cloudPull', 'cloudMerge'):
              if marker not in cloud:
                  raise SystemExit(f'Interface de nuvem ausente: {marker}')

          if 'cloudBootstrap' not in bootstrap:
              raise SystemExit('Botão de ativação guiada ausente')

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for field in ('name', 'short_name', 'start_url', 'display'):
              if not manifest.get(field):
                  raise SystemExit(f'Campo ausente no manifesto: {field}')

          print(f'HTML válido: {len(parser.ids)} IDs estáticos, módulos dinâmicos e manifesto verificados.')
          PY
