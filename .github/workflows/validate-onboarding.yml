name: Validar configuração guiada

on:
  pull_request:
    paths:
      - 'onboarding.js'
      - 'onboarding.css'
      - 'trend-radar.js'
      - 'recommendations.js'
      - 'recommendation-identity.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/ONBOARDING_GUIDE.md'
      - 'tests/validate-onboarding.js'
      - '.github/workflows/validate-onboarding.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check trend-radar.js
          node --check recommendations.js
          node --check onboarding.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-onboarding.js

      - name: Testar jornada guiada
        run: node tests/validate-onboarding.js
