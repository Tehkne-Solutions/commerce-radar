name: Validar biblioteca de playbooks

on:
  pull_request:
    paths:
      - 'activation-playbooks.js'
      - 'activation-playbooks.css'
      - 'activation-retrospective.js'
      - 'activation-plan.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/PLAYBOOK_LIBRARY.md'
      - 'tests/validate-playbook-library.js'
      - '.github/workflows/validate-playbook-library.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-playbook-library:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check activation-playbooks.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-playbook-library.js

      - name: Testar biblioteca e aplicação
        run: node tests/validate-playbook-library.js
