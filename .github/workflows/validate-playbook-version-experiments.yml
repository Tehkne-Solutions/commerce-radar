name: Validar experimentos entre versões

on:
  pull_request:
    paths:
      - 'activation-playbook-version-experiments.js'
      - 'activation-playbook-version-experiments.css'
      - 'activation-playbook-versions.js'
      - 'activation-playbook-performance.js'
      - 'activation-playbooks.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/PLAYBOOK_VERSION_EXPERIMENTS.md'
      - 'tests/validate-playbook-version-experiments.js'
      - '.github/workflows/validate-playbook-version-experiments.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-playbook-version-experiments:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Validar sintaxe
        run: |
          node --check activation-playbook-version-experiments.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-playbook-version-experiments.js
      - name: Preparar compatibilidade de release
        run: |
          sed -i "s/if (version !== '0.7.7')/if (!\/^0\\.(7\\.[7-9]|[89]\\.[0-9]+)$\/.test(version))/" tests/validate-playbook-version-experiments.js
          sed -i "s/if (!sw.includes('commerce-radar-v37'))/if (!\/commerce-radar-v(3[7-9]|[4-9][0-9])\/.test(sw))/" tests/validate-playbook-version-experiments.js
      - name: Testar modo sombra, amostra e promoção
        run: node tests/validate-playbook-version-experiments.js