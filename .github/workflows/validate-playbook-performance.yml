name: Validar desempenho dos playbooks

on:
  pull_request:
    paths:
      - 'activation-playbook-performance.js'
      - 'activation-playbook-performance.css'
      - 'activation-playbooks.js'
      - 'activation-retrospective.js'
      - 'module-loader.js'
      - 'sw.js'
      - 'VERSION'
      - 'docs/PLAYBOOK_PERFORMANCE.md'
      - 'tests/validate-playbook-performance.js'
      - '.github/workflows/validate-playbook-performance.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-playbook-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar sintaxe
        run: |
          node --check activation-playbook-performance.js
          node --check module-loader.js
          node --check sw.js
          node --check tests/validate-playbook-performance.js

      - name: Testar desempenho, revisão e arquivamento
        run: node tests/validate-playbook-performance.js
